name: Build and Release iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: '选择构建版本 (all / hongguojian / zhenguojian)'
        required: true
        default: 'zhenguojian'
        type: choice
        options:
          - zhenguojian
          - hongguojian
          - all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # 1. 编译真果鉴 (全站源版：包含黄豆、剧果、野果、帝果等)
      - name: Build ZhenGuoJian IPA (Full Sources)
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'zhenguojian' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          # 强制彻底清理缓存
          flutter clean
          rm -rf build dist extracted Payload ios/Frameworks zhenguojian-unsigned.ipa

          # 关键修复 1：先单独用 --all-sources 强行编译 Go 原生核心静态库
          echo "=== 正在强行编译 Go 全站源原生核心 ==="
          python3 scripts/build_native.py --platform ios --all-sources || true

          # 关键修复 2：带 --all-sources 参数执行 iOS 构建
          echo "=== 正在构建真果鉴 iOS App ==="
          python3 scripts/build_ios.py --all-sources

          # 解压并定位 .app
          mkdir -p extracted
          if ls dist/ios/*.zip 1> /dev/null 2>&1; then
            for zipfile in dist/ios/*.zip; do
              unzip -o -q "$zipfile" -d extracted/
            done
          fi

          INFO_PLIST=$(find extracted -name "Info.plist" -path "*.app/Info.plist" -not -path "*__MACOSX*" | head -n 1)
          if [ -z "$INFO_PLIST" ]; then
            INFO_PLIST=$(find dist/ios build/ios -name "Info.plist" -path "*.app/Info.plist" -not -path "*__MACOSX*" | head -n 1)
          fi

          if [ -z "$INFO_PLIST" ]; then
            echo "❌ 错误: 未能定位到真果鉴 App Bundle"
            exit 1
          fi

          APP_PATH=$(dirname "$INFO_PLIST")
          echo "✅ 成功定位到真果鉴 App: $APP_PATH"

          # 打包为符合巨魔规范的标准 IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/__MACOSX
          find Payload -name ".DS_Store" -delete
          find Payload/*.app -maxdepth 1 -type f -exec chmod +x {} +

          zip -r -y zhenguojian-unsigned.ipa Payload

      # 2. 编译红果鉴 (单站源版)
      - name: Build HongGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'hongguojian' }}
        run: |
          flutter clean
          rm -rf build dist extracted Payload ios/Frameworks hongguojian-unsigned.ipa
          
          python3 scripts/build_native.py --platform ios || true
          python3 scripts/build_ios.py

          mkdir -p extracted
          if ls dist/ios/*.zip 1> /dev/null 2>&1; then
            for zipfile in dist/ios/*.zip; do
              unzip -o -q "$zipfile" -d extracted/
            done
          fi

          INFO_PLIST=$(find extracted -name "Info.plist" -path "*.app/Info.plist" -not -path "*__MACOSX*" | head -n 1)
          if [ -z "$INFO_PLIST" ]; then
            INFO_PLIST=$(find dist/ios build/ios -name "Info.plist" -path "*.app/Info.plist" -not -path "*__MACOSX*" | head -n 1)
          fi

          APP_PATH=$(dirname "$INFO_PLIST")
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/__MACOSX
          find Payload -name ".DS_Store" -delete
          find Payload/*.app -maxdepth 1 -type f -exec chmod +x {} +

          zip -r -y hongguojian-unsigned.ipa Payload

      # 3. 创建 Release 并上传附件
      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 上传 Artifacts 产物
      - name: Upload Unsigned IPA Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: ignore
