name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: '选择构建版本 (all / hongguojian / zhenguojian)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hongguojian
          - zhenguojian
  push:
    tags:
      - 'v*'

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # 1. 编译并打包 红果鉴 IPA
      - name: Build HongGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'hongguojian' || github.event_name == 'push' }}
        run: |
          # 彻底清理临时目录
          rm -rf build_ipa Payload extracted *.ipa
          
          # 运行项目自带的 iOS 编译脚本
          python3 scripts/build_ios.py

          # 解压 dist/ios 目录下生成的 zip 归档
          mkdir -p extracted
          if ls dist/ios/*.zip 1> /dev/null 2>&1; then
            for zipfile in dist/ios/*.zip; do
              unzip -o -q "$zipfile" -d extracted/
            done
          fi

          # 精确查找真正的 Info.plist 所在路径（排除 __MACOSX 干扰）
          INFO_PLIST=$(find extracted build/ios dist/ios -name "Info.plist" -path "*.app/Info.plist" -not -path "*__MACOSX*" | head -n 1)

          if [ -z "$INFO_PLIST" ]; then
            echo "❌ 错误: 未能定位到有效的 App Bundle (Info.plist)"
            exit 1
          fi

          APP_PATH=$(dirname "$INFO_PLIST")
          echo "✅ 成功找到 .app 路径: $APP_PATH"

          # 创建全新的 Payload 目录并复制 .app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 清理垃圾文件并补全可执行权限
          rm -rf Payload/__MACOSX
          find Payload -name ".DS_Store" -delete
          find Payload/*.app -maxdepth 1 -type f -exec chmod +x {} +

          # 打印结构供确认
          echo "=== 确认 Payload 目录内容 ==="
          ls -la Payload/

          # 核心：打包为标准 IPA (必须带 -y 参数保留软链接)
          zip -r -y hongguojian-unsigned.ipa Payload

          # 校验 IPA 内部结构
          echo "=== IPA 结构校验结果 ==="
          unzip -l hongguojian-unsigned.ipa | grep "Payload/.*\.app/Info\.plist"

      # 2. 编译并打包 真果鉴 (全站源版) IPA
      - name: Build ZhenGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'zhenguojian' || github.event_name == 'push' }}
        run: |
          rm -rf build_ipa Payload extracted *.ipa
          python3 scripts/build_ios.py --all-sources

          mkdir -p extracted
          if ls dist/ios/*.zip 1> /dev/null 2>&1; then
            for zipfile in dist/ios/*.zip; do
              unzip -o -q "$zipfile" -d extracted/
            done
          fi

          INFO_PLIST=$(find extracted build/ios dist/ios -name "Info.plist" -path "*.app/Info.plist" -not -path "*__MACOSX*" | head -n 1)

          if [ -z "$INFO_PLIST" ]; then
            echo "❌ 错误: 未能定位到有效的 App Bundle (Info.plist)"
            exit 1
          fi

          APP_PATH=$(dirname "$INFO_PLIST")
          echo "✅ 成功找到 .app 路径: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          rm -rf Payload/__MACOSX
          find Payload -name ".DS_Store" -delete
          find Payload/*.app -maxdepth 1 -type f -exec chmod +x {} +

          zip -r -y zhenguojian-unsigned.ipa Payload

          echo "=== IPA 结构校验结果 ==="
          unzip -l zhenguojian-unsigned.ipa | grep "Payload/.*\.app/Info\.plist"

      # 3. 上传生成的 IPA 产物
      - name: Upload Unsigned IPA Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error
