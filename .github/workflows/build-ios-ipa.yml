name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: '选择构建版本 (all / hongguojian / zhenguojian)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hongguojian
          - zhenguojian
  push:
    tags:
      - 'v*'

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # 编译 红果鉴 IPA
      - name: Build and Package HongGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'hongguojian' || github.event_name == 'push' }}
        run: |
          python3 scripts/build_ios.py
          
          # 清理临时文件夹
          rm -rf build_ipa Payload
          mkdir -p Payload
          
          # 自动定位构建出的 .app 路径
          APP_PATH=$(find dist/ios build/ios -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app folder not found!"
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          
          # 核心修复：必须加 -y 选项保留符号链接，并在根层级打包 Payload
          zip -r -y hongguojian-unsigned.ipa Payload
          
          # 验证包内部是否有 Info.plist
          unzip -l hongguojian-unsigned.ipa | grep "Payload/.*\.app/Info\.plist"

      # 编译 真果鉴 (全站源版) IPA
      - name: Build and Package ZhenGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'zhenguojian' || github.event_name == 'push' }}
        run: |
          python3 scripts/build_ios.py --all-sources
          
          # 清理临时文件夹
          rm -rf build_ipa Payload
          mkdir -p Payload
          
          APP_PATH=$(find dist/ios build/ios -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app folder not found!"
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          
          # 核心修复：必须加 -y 选项打包
          zip -r -y zhenguojian-unsigned.ipa Payload
          
          # 验证包内部是否有 Info.plist
          unzip -l zhenguojian-unsigned.ipa | grep "Payload/.*\.app/Info\.plist"

      # 上传生成的 IPA 产物
      - name: Upload Unsigned IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: "*.ipa"
