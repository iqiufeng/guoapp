name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: '选择构建版本 (all / hongguojian / zhenguojian)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hongguojian
          - zhenguojian
  push:
    tags:
      - 'v*'

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      # 编译并打包 红果鉴 IPA
      - name: Build HongGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'hongguojian' || github.event_name == 'push' }}
        run: |
          rm -rf dist/ios build/ios Payload extracted
          python3 scripts/build_ios.py

          # 解压 dist/ios 目录下生成的 zip 归档文件
          mkdir -p extracted
          if ls dist/ios/*.zip 1> /dev/null 2>&1; then
            for zipfile in dist/ios/*.zip; do
              unzip -o -q "$zipfile" -d extracted/
            done
          fi

          # 查找解压出来的 .app 目录
          APP_PATH=$(find extracted build/ios dist/ios -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: 未能在产物中定位到 .app 目录！"
            exit 1
          fi

          echo "定位到 .app 目录: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # 打包为标准 IPA (保留 -y 软链接)
          zip -r -y hongguojian-unsigned.ipa Payload

      # 编译并打包 真果鉴 (全站源版) IPA
      - name: Build ZhenGuoJian IPA
        if: ${{ inputs.build_flavor == 'all' || inputs.build_flavor == 'zhenguojian' || github.event_name == 'push' }}
        run: |
          rm -rf dist/ios build/ios Payload extracted
          python3 scripts/build_ios.py --all-sources

          mkdir -p extracted
          if ls dist/ios/*.zip 1> /dev/null 2>&1; then
            for zipfile in dist/ios/*.zip; do
              unzip -o -q "$zipfile" -d extracted/
            done
          fi

          APP_PATH=$(find extracted build/ios dist/ios -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: 未能在产物中定位到 .app 目录！"
            exit 1
          fi

          echo "定位到 .app 目录: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          zip -r -y zhenguojian-unsigned.ipa Payload

      # 上传生成的 IPA 产物
      - name: Upload Unsigned IPA Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error
